<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inchcape Digital — Reporte rápido</title>

  <style>
    :root {
      --bg1: #00233A;
      --bg2: #001426;
      --card: #00233A88;
      --accent: #ED1C24;
      --secondary: #952318;
      --glass: rgba(255, 255, 255, 0.06);
      --muted: rgba(255, 255, 255, 0.6);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #e6eef8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px
    }

    .container {
      width: 100%;
      max-width: 920px
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      color: #fff
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600
    }

    p.lead {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4
    }

    .card {
      background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.01));
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500
    }

    input[type=email],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--glass);
      color: inherit;
      outline: none;
      font-size: 14px;
      transition: border-color .3s, box-shadow .3s
    }

    input[type=email]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.15)
    }

    textarea {
      min-height: 140px;
      resize: vertical
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 0;
      font-weight: 600;
      transition: all .3s
    }

    .btn.send {
      background: linear-gradient(90deg, var(--accent), var(--secondary));
      color: #fff
    }

    .btn.send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(237, 28, 36, 0.3)
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08)
    }

    .btn.ghost:hover {
      border-color: var(--accent);
      color: #fff
    }

    .mic-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.01));
      cursor: pointer;
      transition: all .3s
    }

    .mic-btn:hover {
      box-shadow: 0 4px 12px rgba(237, 28, 36, 0.1)
    }

    .mic-btn.recording {
      box-shadow: 0 6px 20px rgba(237, 28, 36, 0.25);
      transform: translateY(-1px)
    }

    .note {
      font-size: 12px;
      color: #ffd27d;
      margin-left: 10px;
      display: none
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999
    }

    .modal {
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      border-radius: 14px;
      padding: 30px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 18px;
      animation: fadeIn .3s ease
    }

    .modal svg {
      width: 50px;
      height: 50px;
      stroke: #fff
    }

    .modal p {
      margin: 0;
      font-weight: 600
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(.9)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">ID</div>
      <div>
        <h1>Inchcape Digital Andina North — Reporte rápido</h1>
        <p class="lead">
          Envía tu correo laboral y describe el problema. Puedes dictarlo por audio.
        </p>
      </div>
    </header>

    <main class="card">
      <section>

        <form id="supportForm">

          <div style="margin-bottom:14px">
            <label for="email">Correo laboral</label>
            <input id="email" type="email" placeholder="ingresa tu correo" required />
          </div>

          <div style="margin-bottom:10px">
            <label for="problem">Describe tu problema</label>
            <textarea id="problem" placeholder="Escribe aquí los detalles..."></textarea>
          </div>

          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
            <button type="button" id="mic" class="mic-btn">
              🎙️ <span id="micLabel">Iniciar dictado</span>
            </button>
            <div class="note" id="recNote">
              Grabando... presiona el mic para detener.
            </div>
          </div>

          <div class="actions">
            <button class="btn send" type="submit" id="sendBtn">Enviar</button>
            <button class="btn ghost" type="button" id="clearBtn">Limpiar</button>
          </div>

        </form>

      </section>
    </main>

  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="modal" id="modalContent">
      <p>Procesando caso...</p>
    </div>
  </div>

  <script>
    (() => {

      const email = document.getElementById('email');
      const problem = document.getElementById('problem');
      const micBtn = document.getElementById('mic');
      const micLabel = document.getElementById('micLabel');
      const recNote = document.getElementById('recNote');
      const clearBtn = document.getElementById('clearBtn');
      const sendBtn = document.getElementById('sendBtn');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const modalContent = document.getElementById('modalContent');

      let recognition = null;
      let recognizing = false;
      let transcript = '';

      try {

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {

          recognition = new SpeechRecognition();

          recognition.lang = 'es-CO';
          recognition.interimResults = true;
          recognition.continuous = false;

          recognition.onstart = () => {
            recognizing = true;
            micBtn.classList.add('recording');
            micLabel.textContent = 'Detener dictado';
            recNote.style.display = 'block';
          };

          recognition.onend = () => {
            recognizing = false;
            micBtn.classList.remove('recording');
            micLabel.textContent = 'Iniciar dictado';
            recNote.style.display = 'none';
          };

          recognition.onresult = (event) => {

            let interim = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {

              if (event.results[i].isFinal) {
                transcript += event.results[i][0].transcript;
              } else {
                interim += event.results[i][0].transcript;
              }

            }

            problem.value = transcript + (interim ? '\n' + interim : '');

          };

          recognition.onerror = (e) => {
            console.warn('Speech error', e);
            alert('Error en reconocimiento de voz: ' + (e.error || 'unknown'));
          };

        } else {

          micBtn.style.display = 'none';

        }

      } catch (e) {

        micBtn.style.display = 'none';

      }

      micBtn.addEventListener('click', () => {

        if (!recognition) return;

        if (recognizing) {
          recognition.stop();
        } else {
          transcript = '';
          recognition.start();
        }

      });

    })();
  </script>

</body>
</html>
