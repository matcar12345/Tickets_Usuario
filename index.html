<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestra Historia ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at top, #2b101a 0%, #14070c 45%, #080407 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 35px 35px;
            opacity: 0.25;
        }

        .container {
            width: min(1100px, 90%);
            margin: auto;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-heart {
            font-size: 55px;
            animation: heartbeat 1.7s infinite;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 85px);
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #e8cfd5;
            max-width: 650px;
            line-height: 1.7;
        }

        .scroll-text {
            margin-top: 60px;
            font-size: 14px;
            color: #c89aa7;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* TIMELINE */

        .timeline-section {
            padding: 100px 0 150px;
        }

        .timeline-title {
            text-align: center;
            margin-bottom: 90px;
        }

        .timeline-title h2 {
            font-size: 42px;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .timeline-title p {
            color: #cfaab4;
            font-size: 17px;
        }

        .timeline {
            position: relative;
            max-width: 900px;
            margin: auto;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 2px;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent,
                #8e4558,
                #d88ca0,
                #8e4558,
                transparent
            );
        }

        .moment {
            position: relative;
            width: 50%;
            padding: 30px 45px;
        }

        .moment:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .moment:nth-child(even) {
            left: 50%;
            text-align: left;
        }

        .moment-card {
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 25px;
            cursor: pointer;
            transition: 0.35s ease;
            backdrop-filter: blur(8px);
        }

        .moment-card:hover {
            transform: translateY(-8px);
            border-color: rgba(234, 145, 168, 0.5);
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .moment-number {
            color: #d88ca0;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .moment-card h3 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .moment-date {
            color: #bd8b98;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .moment-card p {
            color: #d8c5ca;
            line-height: 1.6;
            font-size: 15px;
        }

        .timeline-dot {
            position: absolute;
            top: 55px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e4a0b2;
            border: 4px solid #16080d;
            box-shadow: 0 0 20px rgba(228,160,178,0.8);
            z-index: 2;
        }

        .moment:nth-child(odd) .timeline-dot {
            right: -9px;
        }

        .moment:nth-child(even) .timeline-dot {
            left: -9px;
        }

        /* MODAL / DETAIL */

        .detail {
            position: fixed;
            inset: 0;
            background: rgba(5,2,5,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 1000;
            overflow-y: auto;
        }

        .detail.active {
            display: flex;
        }

        .detail-content {
            width: min(1000px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background:
                linear-gradient(
                    145deg,
                    rgba(55,21,32,0.98),
                    rgba(20,8,13,0.98)
                );
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            animation: appear 0.4s ease;
        }

        .close-btn {
            position: absolute;
            right: 25px;
            top: 20px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.18);
        }

        .detail-header {
            text-align: center;
            margin-bottom: 35px;
            padding: 0 40px;
        }

        .detail-header .number {
            color: #d88ca0;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .detail-header h2 {
            font-size: clamp(32px, 6vw, 52px);
            font-weight: 400;
            margin: 10px 0;
        }

        .detail-header .date {
            color: #b88c98;
        }

        .detail-text {
            color: #eadce0;
            line-height: 1.9;
            font-size: 17px;
            max-width: 800px;
            margin: 0 auto 40px;
            white-space: pre-line;
            text-align: center;
        }

        /* BOTÓN PARA MOSTRAR RECUERDOS */

        .memory-toggle {
            display: block;
            margin: 0 auto 25px;
            padding: 12px 24px;
            border: 1px solid rgba(216,140,160,0.45);
            border-radius: 999px;
            background: rgba(216,140,160,0.10);
            color: #f4dbe1;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .memory-toggle:hover {
            background: rgba(216,140,160,0.20);
            border-color: rgba(216,140,160,0.75);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.22);
        }

        .memory-toggle:active {
            transform: translateY(0);
        }

        /* GALERÍA */

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .gallery.collapsed {
            display: none;
        }

        .gallery.revealed {
            animation: galleryReveal 0.45s ease;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
            background: #241016;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }

        .empty-message {
            color: #8e727a;
            text-align: center;
            padding: 50px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 80px 20px;
            color: #b89099;
        }

        footer .footer-heart {
            font-size: 35px;
            margin-bottom: 20px;
        }

        @keyframes galleryReveal {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ANIMACIONES */

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.1);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.08);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* RESPONSIVE */

        @media (max-width: 750px) {

            .timeline::before {
                left: 15px;
            }

            .moment,
            .moment:nth-child(even),
            .moment:nth-child(odd) {
                width: 100%;
                left: 0;
                text-align: left;
                padding-left: 45px;
                padding-right: 0;
            }

            .moment:nth-child(odd) .timeline-dot,
            .moment:nth-child(even) .timeline-dot {
                left: 6px;
                right: auto;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 250px;
            }

            .detail-content {
                padding: 25px 18px;
            }

            .detail-header {
                padding: 0 25px;
            }

            .hero h1 {
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <!-- PORTADA -->

    <section class="hero">

        <div class="hero-heart">❤️</div>

        <h1>Nuestra Historia</h1>

        <p>
            Cinco momentos, un montón de recuerdos
            y una historia que todavía estamos escribiendo.
        </p>

        <div class="scroll-text">
            ↓ Desliza para comenzar ↓
        </div>

    </section>


    <!-- LINEA DEL TIEMPO -->

    <section class="timeline-section">

        <div class="container">

            <div class="timeline-title">

                <h2>Lo nuestro</h2>

                <p>
                    Cada momento guarda algo que quiero recordar.
                </p>

            </div>


            <div class="timeline" id="timeline">

                <!-- Los momentos se generan automáticamente con JS -->

            </div>

        </div>

    </section>


    <!-- VENTANA DE DETALLE -->

    <div class="detail" id="detail">

        <div class="detail-content">

            <button class="close-btn" id="closeBtn">
                ×
            </button>

            <div class="detail-header">

                <div class="number" id="detailNumber"></div>

                <h2 id="detailTitle"></h2>

                <div class="date" id="detailDate"></div>

            </div>

            <div class="detail-text" id="detailText"></div>

            <button class="memory-toggle" id="memoryToggle" type="button">
                Ver recuerdos ❤️
            </button>

            <div class="gallery collapsed" id="gallery"></div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <div class="footer-heart">
            ❤️
        </div>

        <p>
            Y esta historia todavía no termina...
        </p>

    </footer>


    <script>

        /*
        ============================================================
        DATOS DE LOS 5 MOMENTOS
        ============================================================

        Puedes cambiar:

        title  = título
        date   = fecha
        text   = texto
        images = hasta 4 imágenes

        Las imágenes deben estar dentro de una carpeta llamada
        "images".

        Ejemplo:

        proyecto/
        │
        ├── index.html
        │
        └── images/
            ├── momento1-1.jpg
            ├── momento1-2.jpg
            ├── momento1-3.jpg
            └── momento1-4.jpg
        */

        const moments = [

            {
                title: "Cuando todo comenzó",
                date: "Nuestro comienzo",
                text: `
                    Aquí empezó algo que ninguno de los dos podía imaginar todo lo que llegaría a significar.

                    Tal vez en ese momento todavía no sabía lo importante que ibas a terminar siendo para mí. Todo comenzó con una imagen, con tu foto de perfil. Y, desde ese instante, hubo algo en mí que supo que tú ibas a ser la mujer de mi vida.

                    Pasaron muchos momentos antes de que finalmente pudiera hablar contigo, pero cuando por fin lo hice, descubrí que había mucho más de ti por conocer. No solo descubrí lo hermosa que eres, sino también la mujer que existe detrás de esa belleza: una mujer exquisita, con una mente que admiro y que, incluso desde entonces, comenzó a cautivarme de una manera que no sabía explicar.

                    Y fue ahí cuando le prometí a Dios que tú ibas a ser mi mujer, mi esposa.

                    Una promesa que hice con el corazón, sin saber todavía todo lo que llegaríamos a vivir, pero sabiendo que, si algún día tenía la oportunidad de compartir mi vida contigo, quería hacerlo de verdad.

                    Y no pienso romper mi promesa.

                `,
                images: [
                    "images/momento1-1.jpg",
                    "images/momento1-2.jpg",
                    "images/momento1-3.jpg",
                    "images/momento1-4.jpg"
                ]
            },

            {
                title: "Las primeras veces",
                date: "Nuestros primeros recuerdos",
                text: `
                    La primera vez que te vi fue algo muy hermoso para mí. No podía creer que, en persona, fueras incluso más hermosa de lo que había imaginado. Te veías físicamente perfecta, y recuerdo pensar que era increíble que realmente estuviera logrando que una mujer como tú se enamorara de mí.

                    Desde el principio, tu familia también me agradó muchísimo. Me hicieron sentir bienvenido y, de alguna manera, hicieron que aquel día se sintiera todavía más especial.

                    Recuerdo mucho nuestra primera vez en Gran Plaza. Estábamos los dos tan nerviosos que hasta decidir qué comer se volvió complicado. Terminamos pidiendo pizza, como si no existiera ninguna otra opción en todo el centro comercial. Y, para rematar, tuve que dejar que fueras tú quien me diera el primer beso jajaja. Así de nervioso me tenías.

                    Pero, aunque hubo nervios, silencios y momentos en los que ninguno sabía muy bien qué hacer, no tengo dudas de que fue una de las mejores tardes que he vivido.

                    Después pediste permiso para que pudiéramos ver juntos el partido de Colombia, y ese día terminó convirtiéndose en algo que todavía recuerdo con muchísimo cariño.

                    Fue nuestro primer encuentro, y para mí, fue perfecto.

                    A veces quisiera tener alguna imagen o alguna foto de ese día para poder volver a verlo, pero no la necesito realmente. Todas las imágenes de aquella tarde siguen guardadas en mi mente.

                `,
                images: [
                    "images/momento2-1.jpg",
                    "images/momento2-2.jpg",
                    "images/momento2-3.jpg",
                    "images/momento2-4.jpg"
                ]
            },

            {
                title: "Lo que fuimos construyendo",
                date: "Poco a poco",
                text: `
                    Con el tiempo empecé a sentir la necesidad de que lo nuestro tuviera un nombre, de que tú fueras oficialmente mi novia. No quería simplemente estar contigo; quería poder decirle a cualquiera, con todo el orgullo del mundo, que tú eras mi novia, que eras la mujer que había elegido para compartir mi vida.

No sabía ni siquiera cómo decírtelo. Pensé en preparar una cena, quizá en un parque rodeado de zonas verdes, tal vez en tu casa con algunas decoraciones. Tenía tantas ideas en la cabeza que no sabía cuál sería la indicada.

Pero un día fuimos tú y yo a Salitre Mágico, y yo no tenía pensado proponerte nada.

Hasta que terminamos en la rueda gigante.

Estábamos ahí arriba, viendo todo desde lo alto, y en menos de un segundo pensé:

¿Por qué no aquí?
¿Por qué no ahora?
¿Por qué no en la cima de una rueda gigante?

¿Por qué no hacer algo que ni siquiera yo mismo había imaginado?

Y así, sin un plan perfecto, sin prepararlo durante semanas y sin saber exactamente cómo hacerlo, decidí que ese era el momento.

Ese día fue hermoso. Te sentí tan cerca de mí, tan parte de mi vida, que todavía me cuesta explicar lo que significó. Incluso tuve la oportunidad de conocerte enojada, porque después de comer cambiaste completamente de humor jajajaja.

Y, de alguna manera, hasta eso hizo que el día fuera perfecto.

Porque no fue perfecto porque todo saliera exactamente como lo había imaginado. Fue perfecto porque eras tú, porque estábamos juntos y porque, en medio de todo aquello, terminé entendiendo algo que quizá ya sabía desde antes, pero que ese día sentí con mucha más fuerza:

Lo nuestro era algo realmente especial.

                `,
                images: [
                    "images/momento3-1.jpg",
                    "images/momento3-2.jpg",
                    "images/momento3-3.jpg",
                    "images/momento3-4.jpg"
                ]
            },

            {
                title: "Tú",
                date: "Una de mis partes favoritas de nosotros",
                text: `
                    Luego está aquel día en el que hicimos el amor.

Antes de que sucediera hubo peleas, discusiones, desacuerdos, horarios que nunca parecían coincidir y, sobre todo, una mezcla de emociones que no sabía cómo manejar. Era mi primera vez, y durante la semana anterior sentí de todo: dudas, miedo, nervios y también muchas ganas. Pensaba demasiado en lo que iba a pasar, quizá porque no sabía cómo sería vivir algo así contigo.

Pero cuando recuerdo ese día, hay una sensación que aparece antes que cualquier otra:

Tranquilidad.

Eso es lo que siento cuando estoy en intimidad contigo. Tranquilidad. Como si, por un momento, todo lo demás dejara de existir.

No existe el trabajo, ni los complejos, ni los prejuicios, ni las peleas, ni el dinero, ni todas esas cosas que a veces pesan tanto sobre nosotros.

Solo existimos tú y yo.

Y el deseo de amarnos, de sentirnos, de hacernos bien y de compartir algo que pertenece únicamente a los dos.

Para mí, eso es hacer el amor.

Y fue contigo, por primera vez, que descubrí que podía sentirse así.

                `,
                images: [
                    "images/momento4-1.jpg",
                    "images/momento4-2.jpg",
                    "images/momento4-3.jpg",
                    "images/momento4-4.jpg"
                ]
            },

            {
                title: "Lo que viene",
                date: "Nuestra historia continúa",
                text: `
                    Y ahora...

Ahora vivimos la maduración de nuestra relación. Peleamos, discutimos, estamos tensos y, en otros momentos, somos intensos. A veces estamos bien, otras veces no tanto. Hemos tenido días fáciles y días difíciles, momentos en los que pareciera que todo fluye y otros en los que nos cuesta incluso entendernos.

Pero hoy, en el presente, hay algo que sigue siendo hermoso gracias a ti:

Te tengo en mi vida.

Y por ti daría todo lo que estuviera en mis manos. El cielo, la tierra, incluso el infierno si fuera necesario. Porque hoy sé que hay cosas que pueden complicarnos, momentos que pueden hacernos tropezar y circunstancias que pueden ponernos a prueba, pero nada de eso cambia lo que siento por ti.

Porque hoy, después de todo lo que hemos vivido, por fin puedo decirlo sin miedo:

Te amo, Vivi.

Te amo de verdad.

No es falso, no es fingido, no es algo que digo porque sí. Es real. Lo siento en lo que pienso, en lo que hago y en la manera en que te has convertido en una parte tan importante de mi vida.

Y hoy no existe otra mujer a la que quiera amar.

Solo tú.

Mi niña linda.

                `,
                images: [
                    "img1.jpeg",
                    "img2.jpeg",
                    "img3.jpeg",
                    "img4.jpeg"
                ]
            }

        ];


        /*
        ============================================================
        GENERAR LA LINEA DEL TIEMPO
        ============================================================
        */

        const timeline = document.getElementById("timeline");

        moments.forEach((moment, index) => {

            const article = document.createElement("article");

            article.className = "moment";

            article.innerHTML = `

                <div class="timeline-dot"></div>

                <div class="moment-card" onclick="openMoment(${index})">

                    <div class="moment-number">
                        Momento ${index + 1}
                    </div>

                    <h3>
                        ${moment.title}
                    </h3>

                    <div class="moment-date">
                        ${moment.date}
                    </div>

                    <p>
                        Haz clic para recordar este momento ❤️
                    </p>

                </div>
            `;

            timeline.appendChild(article);

        });


        /*
        ============================================================
        ELEMENTOS DEL DETALLE
        ============================================================
        */

        const detail = document.getElementById("detail");
        const closeBtn = document.getElementById("closeBtn");

        const detailNumber = document.getElementById("detailNumber");
        const detailTitle = document.getElementById("detailTitle");
        const detailDate = document.getElementById("detailDate");
        const detailText = document.getElementById("detailText");
        const gallery = document.getElementById("gallery");
        const memoryToggle = document.getElementById("memoryToggle");


        /*
        ============================================================
        ABRIR MOMENTO
        ============================================================
        */

        function openMoment(index) {

            const moment = moments[index];

            detailNumber.textContent = `Momento ${index + 1}`;

            detailTitle.textContent = moment.title;

            detailDate.textContent = moment.date;

            detailText.textContent = moment.text;

            gallery.innerHTML = "";
            gallery.classList.remove("revealed");
            gallery.classList.add("collapsed");
            memoryToggle.textContent = "Ver recuerdos ❤️";


            /*
            Solo mostramos imágenes que realmente existan
            en el array.
            */

            moment.images.forEach((image) => {

                if (!image) return;

                const img = document.createElement("img");

                img.src = image;

                img.alt = moment.title;

                img.onerror = function () {

                    this.style.display = "none";

                };

                img.onclick = function () {

                    window.open(image, "_blank");

                };

                gallery.appendChild(img);

            });


            detail.classList.add("active");

            document.body.style.overflow = "hidden";
        }


        /*
        ============================================================
        MOSTRAR / OCULTAR RECUERDOS
        ============================================================
        */

        memoryToggle.addEventListener("click", function() {

            const isCollapsed = gallery.classList.contains("collapsed");

            if (isCollapsed) {

                gallery.classList.remove("collapsed");
                gallery.classList.remove("revealed");

                // Reinicia la animación al abrir.
                void gallery.offsetWidth;

                gallery.classList.add("revealed");

                memoryToggle.textContent = "Ocultar recuerdos ↑";

            } else {

                gallery.classList.remove("revealed");
                gallery.classList.add("collapsed");

                memoryToggle.textContent = "Ver recuerdos ❤️";

            }

        });


        /*
        ============================================================
        CERRAR
        ============================================================
        */

        function closeMoment() {

            detail.classList.remove("active");

            document.body.style.overflow = "";

        }


        closeBtn.addEventListener("click", closeMoment);


        /*
        Cerrar haciendo clic fuera de la ventana
        */

        detail.addEventListener("click", function(event) {

            if (event.target === detail) {

                closeMoment();

            }

        });


        /*
        Cerrar con ESC
        */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                closeMoment();

            }

        });

    </script>

</body>
</html>
