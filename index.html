<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inchcape Digital — Reporte rápido</title>
  <style>
    :root{
      --bg1:#00233A; --bg2:#001426; --card:#00233A88; --accent:#ED1C24; --secondary:#952318; --glass:rgba(255,255,255,0.06);
      --muted:rgba(255,255,255,0.6);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      font-size: 16px;
    }
    *{box-sizing:border-box}
    body{margin:0; min-height:100vh; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:#e6eef8; display:flex; align-items:center; justify-content:center; padding:2rem}
    .container{width:100%; max-width:960px}
    header{display:flex; align-items:center; gap:1.5rem; margin-bottom:1.5rem}
    .logo{width:80px; height:80px; border-radius:1rem; background:linear-gradient(135deg,var(--accent),var(--secondary)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:2rem; box-shadow:0 8px 24px rgba(0,0,0,0.4); color:#fff}
    h1{margin:0; font-size:1.5rem; font-weight:600}
    p.lead{margin:0; color:var(--muted); font-size:0.875rem; line-height:1.4}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border-radius:1rem; padding:1.5rem; box-shadow: 0 12px 36px rgba(0,0,0,0.5); display:grid; grid-template-columns:1fr; gap:1.25rem}
    label{display:block; font-size:0.875rem; color:var(--muted); margin-bottom:0.5rem; font-weight:500}
    input[type=email], textarea{width:100%; padding:0.875rem 1rem; border-radius:0.75rem; border:1px solid rgba(255,255,255,0.08); background:var(--glass); color:inherit; outline:none; font-size:1rem; transition: border-color 0.3s, box-shadow 0.3s}
    input[type=email]:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(237,28,36,0.15)}
    textarea{min-height:160px; resize:vertical}
    .field{margin-bottom:1rem}
    .mic-group{display:flex; align-items:center; gap:1rem; margin-bottom:1rem}
    .actions{display:flex; gap:1rem; margin-top:1rem}
    .btn{padding:0.875rem 1.25rem; border-radius:0.75rem; cursor:pointer; border:0; font-weight:600; transition: all 0.3s; font-size:1rem}
    .btn.send{background:linear-gradient(90deg,var(--accent),var(--secondary)); color:#fff}
    .btn.send:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(237,28,36,0.3)}
    .btn.ghost{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.08)}
    .btn.ghost:hover{border-color:var(--accent); color:#fff}
    .mic-btn{display:inline-flex; align-items:center; gap:0.75rem; padding:0.875rem 1rem; border-radius:0.75rem; border:1px solid rgba(255,255,255,0.08); background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); cursor:pointer; transition: all 0.3s; font-size:1rem}
    .mic-btn:hover{box-shadow:0 4px 12px rgba(237,28,36,0.1)}
    .mic-btn.recording{box-shadow:0 8px 24px rgba(237,28,36,0.25); transform:translateY(-2px)}
    .note{font-size:0.75rem; color:#ffd27d; margin-left:1rem; display:none}
    .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999}
    .modal{background:linear-gradient(135deg,var(--accent),var(--secondary)); border-radius:1rem; padding:2rem 3rem; text-align:center; display:flex; flex-direction:column; align-items:center; gap:1rem; box-shadow:0 12px 36px rgba(0,0,0,0.6); color:#fff; font-size:1.25rem; max-width:80%; animation:fadeIn 0.3s ease}
    .modal svg{width:60px;height:60px; stroke:#fff}
    .modal p{margin:0;font-weight:600}
    @keyframes fadeIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">ID</div>
      <div>
        <h1>Inchcape Digital Andina North — Reporte rápido</h1>
        <p class="lead">Envía tu correo laboral y describe el problema. Puedes dictarlo por audio.</p>
      </div>
    </header>
    <main class="card" role="main">
      <section>
        <form id="supportForm">
          <div class="field">
            <label for="email">Correo laboral</label>
            <input id="email" type="email" placeholder="ingresa tu correo" required />
          </div>
          <div class="field">
            <label for="problem">Describe tu problema</label>
            <textarea id="problem" placeholder="Escribe aquí los detalles..."></textarea>
          </div>
          <div class="mic-group">
            <button type="button" id="mic" class="mic-btn">🎙️ <span id="micLabel">Iniciar dictado</span></button>
            <div class="note" id="recNote">Grabando... presiona el mic para detener.</div>
          </div>
          <div class="actions">
            <button class="btn send" type="submit" id="sendBtn">Enviar</button>
            <button class="btn ghost" type="button" id="clearBtn">Limpiar</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="modal" id="modalContent">
      <p>Procesando caso...</p>
    </div>
  </div>
  <script>
(() => {
  const email = document.getElementById('email');
  const problem = document.getElementById('problem');
  const micBtn = document.getElementById('mic');
  const micLabel = document.getElementById('micLabel');
  const recNote = document.getElementById('recNote');
  const clearBtn = document.getElementById('clearBtn');
  const sendBtn = document.getElementById('sendBtn');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const modalContent = document.getElementById('modalContent');
  let recognition = null;
  let recognizing = false;
  let transcript = '';
  try {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-CO';
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onstart = () => { recognizing = true; micBtn.classList.add('recording'); micLabel.textContent = 'Detener dictado'; recNote.style.display = 'block'; };
      recognition.onend = () => { recognizing = false; micBtn.classList.remove('recording'); micLabel.textContent = 'Iniciar dictado'; recNote.style.display = 'none'; };
      recognition.onresult = (event) => { let interim=''; for(let i=event.resultIndex;i<event.results.length;i++){ if(event.results[i].isFinal) transcript+=event.results[i][0].transcript; else interim+=event.results[i][0].transcript; } problem.value = transcript + (interim ? '\n'+interim : ''); };
      recognition.onerror = (e) => { console.warn('Speech error', e); alert('Error en reconocimiento de voz: ' + (e.error || 'unknown')); };
    } else { micBtn.style.display = 'none'; }
  } catch(e) { micBtn.style.display = 'none'; }
  micBtn.addEventListener('click', () => { if(!recognition) return; if(recognizing) recognition.stop(); else { transcript=''; recognition.start(); } });
  document.getElementById('supportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const obj = { email: email.value.trim(), problem: problem.value.trim(), audioUsed: !!transcript, transcript: transcript || null, timestamp: new Date().toISOString() };
    const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    if(!emailPattern.test(obj.email)){ alert('Por favor ingresa un correo válido.'); email.focus(); return; }
    const personalProviders=['gmail.com','hotmail.com','outlook.com','yahoo.com','icloud.com'];
    const domain=obj.email.split('@')[1]?.toLowerCase();
    if(personalProviders.includes(domain)){ if(!confirm('El correo parece de un proveedor personal ('+domain+'). ¿Deseas continuar con este correo?')) return; }
    sendBtn.disabled = true;
    modalContent.innerHTML = "<p>Procesando caso...</p>";
    loadingOverlay.style.display = 'flex';
    try{
      const response = await fetch("https://levitra-pine-substantially-labor.trycloudflare.com/procesar_caso", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ descripcion: obj.problem, email: obj.email })
      });
      const data = await response.json();
      if (!response.ok || data.status === "error") {
        modalContent.innerHTML = `
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <p>Error al procesar<br>${data.message || 'Intenta de nuevo'}</p>
        `;
      } else if (data.ticket?.TITULO_TEMA === "mensaje_no_valido" || !data.is_valid) {
        modalContent.innerHTML = `
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <p>No parece un problema técnico de soporte.<br>Por favor describe un inconveniente laboral.</p>
        `;
      } else {
        modalContent.innerHTML = `
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          <p>Se ha creado su caso</p>
        `;
      }
    }catch(err){
      console.error(err);
      modalContent.innerHTML = "<p>Error al procesar el caso<br>Revisa tu conexión</p>";
    }finally{
      sendBtn.disabled = false;
      const stored = JSON.parse(localStorage.getItem('soporte_reports') || '[]');
      stored.push(obj);
      localStorage.setItem('soporte_reports', JSON.stringify(stored));
      setTimeout(()=>{ loadingOverlay.style.display='none'; email.value=''; problem.value=''; transcript=''; }, 1800);
    }
  });
  clearBtn.addEventListener('click', ()=>{ if(confirm('Limpiar correo y descripción?')){ email.value=''; problem.value=''; transcript=''; } });
})();
  </script>
</body>
</html>
